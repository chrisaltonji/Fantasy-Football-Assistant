[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ffa"
version = "0.1.0"
description = "Live ESPN auction draft assistant"
requires-python = ">=3.11"
dependencies = [
    "espn-api>=0.44.1",
    "requests>=2.31",
    "openpyxl>=3.1",
    "tomli-w>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# The live ESPN draft-room reader attaches to a running Chrome over CDP.
# Optional: everything else — manual entry, the simulator, replay — works
# without it, and the draft must not be blocked on an install.
espn = [
    "playwright>=1.40",
]

[project.scripts]
ffa = "ffa.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

# The dashboard page is data, not code, and setuptools does not ship it
# otherwise. An editable install reads it straight from src and works either
# way, so the failure this prevents only appears on a real install — which is
# exactly the kind that would show up first on draft day.
[tool.setuptools.package-data]
"ffa.dashboard" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

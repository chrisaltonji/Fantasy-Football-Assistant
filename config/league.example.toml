# Template for config/league.toml (which is gitignored).
#
# You normally do NOT hand-write this — run:
#     ffa config init --league-id 123456 --year 2026
# which pulls team count, roster slots, budget, and scoring from ESPN's
# mSettings view and writes the real file. This template documents the shape
# and lets you run the tool fully offline if ESPN is unreachable.

[league]
league_id = 123456
year = 2026
# Private leagues require ESPN_S2 / ESPN_SWID in .env.
private = true
name = "My League"

[draft]
# "AUCTION" or "SNAKE". This tool is built for AUCTION.
type = "AUCTION"
# Per-team auction budget in whole dollars.
budget = 200

[teams]
count = 12
# ESPN's numeric team id for YOUR team. It's the `teamId=` in your team URL.
my_team_id = 0

# ESPN team ids are NOT guaranteed contiguous — a league that ever removed and
# re-added a team leaves a hole (a real one observed: 1-5 and 7-13, no 6).
# Read them from ?view=mTeam. Leave empty for 1..count if your league is clean;
# get it wrong and the tool invents a team that doesn't exist while dropping
# one that does.
ids = []

# Starting lineup slots. Bench and IR are counted separately because they
# change the max-bid math (a bench slot still costs you at least $1).
[roster]
QB = 1
RB = 2
WR = 2
TE = 1
FLEX = 1
K = 1
DST = 1
BE = 7
IR = 1

# FLEX eligibility — which positions can fill a FLEX slot.
flex_positions = ["RB", "WR", "TE"]

# What you type to name a rival mid-draft: `sold barkley 62 dave`. Keys are
# ESPN team ids. Short beats formal — you will type these ~180 times on draft
# day. Nicknames must be unique. Any team you leave out is still addressable as
# `t3` / `team3` / `3`, and unique prefixes work too (`dav` -> dave).
[managers]
1 = "chris"
2 = "dave"
3 = "sam"

# ESPN member SWIDs keyed by team id. The stable anchor for who a team actually
# is -- team names change constantly, so nothing keys off them. Written by
# `ffa config init`; you should not need to touch it.
[owners]
# 1 = "{XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX}"

# Two ESPN accounts, one human. A manager who drafts under a second login is two
# people to every join in this tool, and the arithmetic stays perfectly correct
# about somebody who does not exist. `secondary = "primary"`; the account that
# currently holds a seat wins, so the direction does not matter.
#
# Declared by hand and NEVER inferred -- two similar names are not evidence.
# Find candidates with:  ffa config alias
[aliases]
# "{OLD-ACCOUNT-SWID}" = "{CURRENT-ACCOUNT-SWID}"

# Team names and real names keyed by team id, both written by `ffa config init`.
# Display only: a team name changes mid-season, so nothing resolves against one.
[team_names]
# 1 = "Fighting Finkelsteins"

[real_names]
# 1 = "Michael Curley"

[scoring]
# Informational: "STANDARD", "PPR", "HALF_PPR". Drives nothing in the
# integration layer; the advisory layer uses it to pick a default value curve.
type = "PPR"

[reference]
# Your exported auction values. Export from your calculator AT YOUR REAL LEAGUE
# SETTINGS (teams, budget, scoring, roster) — then the rescaling below is a
# no-op safety net rather than a correction. CSV, XLSX, or pasted TSV all work.
# Leave blank to run on the sample fixture, which has invented values.
path = "data/reference/auction_values.csv"

# Your auction values were computed for a league of this shape. Values get
# rescaled to YOUR league via:
#     scaled = value * (teams.count * draft.budget) / (baseline_teams * baseline_budget)
baseline_teams = 12
baseline_budget = 200

[polling]
# Seconds between ESPN polls during a live draft. Keep this conservative —
# ESPN's internal API is undocumented and unrate-limited only by their goodwill.
interval_seconds = 3.0
# Consecutive failures before the source flips to DEGRADED and manual entry
# takes over.
failure_threshold = 4

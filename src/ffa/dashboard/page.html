<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draft Board</title>
<style>
/* Built for one situation: 8pm, next to the ESPN draft room, thirty seconds to
   decide, being bid against the whole time. That rules most things out.

   The numbers are the design. Two of them — what you can legally spend and what
   the sheet says he is worth — get the largest type on the page and never
   scroll away. Everything else is support, set small, and gets out of the way.

   Semantic colour is separate from structural colour, and only three states
   exist: LIVE (a rival who can both afford him and start him — the only kind
   that can take him from you), SAFE (yours, or nobody's), and INERT (money that
   cannot reach this player). Inert is the important one, and it is the whole
   reason this page exists: a team with $90 and no RB slot is not an RB threat,
   and here that reads instantly instead of after a mental join. */
:root{
  --bg:#141110; --panel:#1d1917; --raised:#262120; --line:#332c29;
  --ink:#f0ebe7; --muted:#a2968f; --faint:#6d635e;

  /* Semantic. Never used for structure. */
  --live:#e8b463; --live-bg:#2b210f; --live-line:#7a5a1e;
  --safe:#5fd08a; --safe-bg:#12281c;
  --mine:#8ab4f8; --mine-bg:#16223a;
  --alarm:#f08b7f; --alarm-bg:#2e1613;

  /* Structural only. */
  --accent:#e79aa3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* --- tier 1: your money. Pinned, because it is the thing you look at most. --- */
#mine{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:10px 16px;
  display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;
}
.big{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px 14px;min-width:132px;flex:1 1 132px;
}
.big.hero{border-color:var(--mine);background:var(--mine-bg)}
.big .k{
  display:block;font-size:10px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--muted);white-space:nowrap;
}
.big .v{display:block;font-size:30px;font-weight:680;line-height:1.08;margin-top:2px}
.big.hero .v{color:var(--mine);font-size:38px}
.big .sub{display:block;font-size:11px;color:var(--faint);margin-top:1px}
.big.warnstate{border-color:var(--live);background:var(--live-bg)}
.big.warnstate .v{color:var(--live)}
.big.alarmstate{border-color:var(--alarm);background:var(--alarm-bg)}
.big.alarmstate .v{color:var(--alarm)}

.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.chip{
  font-size:10px;font-weight:650;padding:1px 6px;border-radius:4px;
  background:var(--raised);color:var(--muted);border:1px solid var(--line);
  white-space:nowrap;letter-spacing:.02em;
}
.chip.need{background:var(--live-bg);color:var(--live);border-color:var(--live-line)}

main{padding:14px 16px 60px;display:grid;gap:12px;
     grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
section h2{
  margin:0 0 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);font-weight:700;display:flex;justify-content:space-between;
  align-items:baseline;gap:10px;
}
section h2 .aside{color:var(--faint);letter-spacing:.02em;text-transform:none;font-weight:500;font-size:11px}
.span2{grid-column:1 / -1}
.empty{color:var(--faint);font-size:12.5px;padding:2px 0}

/* --- tier 2: the player on the block. --- */
#focus.up{border-color:var(--accent)}
.player{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.player .name{font-size:23px;font-weight:680;letter-spacing:-.02em}
.pos{
  font-size:10.5px;font-weight:750;padding:2px 6px;border-radius:4px;
  background:var(--raised);color:var(--muted);letter-spacing:.04em;
}
.bidrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.bidbox{border:1px solid var(--line);border-radius:9px;padding:7px 12px;flex:1 1 120px;background:var(--raised)}
/* Judgement and arithmetic must not look alike: one is what he is worth, the
   other is what you physically cannot exceed. */
.bidbox.advice{border-color:var(--safe);background:var(--safe-bg)}
.bidbox.advice .v{color:var(--safe)}
.bidbox.ceiling{border-style:dashed}
.bidbox .k{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.bidbox .v{display:block;font-size:24px;font-weight:670;line-height:1.1;margin-top:1px}
.bidbox .sub{display:block;font-size:10.5px;color:var(--faint)}

/* --- the join the whole page exists for --- */
.threats{display:flex;flex-direction:column;gap:4px}
.threat{
  display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  padding:6px 9px;border-radius:7px;border:1px solid var(--line);
  border-left:3px solid var(--faint);background:var(--raised);
}
.threat.live{border-left-color:var(--live);background:var(--live-bg)}
.threat.inert{opacity:.42}
.threat .who{font-weight:620;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.threat .cap{font-size:16px;font-weight:680}
.threat.live .cap{color:var(--live)}
.threat .meta{font-size:10.5px;color:var(--faint);white-space:nowrap}
.reasons{margin:10px 0 0;padding:0;list-style:none}
.reasons li{font-size:12px;color:var(--muted);padding:2px 0 2px 12px;position:relative}
.reasons li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:1px;background:var(--faint)}

/* --- tier 3: rivals, budget and need as one object --- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:7px}
.tile{
  border:1px solid var(--line);border-left:3px solid var(--faint);border-radius:8px;
  padding:7px 9px;background:var(--raised);
}
.tile.live{border-left-color:var(--live)}
.tile.inert{opacity:.45}
.tile.me{border-left-color:var(--mine);background:var(--mine-bg)}
.tile .who{font-weight:640;font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
.tile .who .slots{color:var(--faint);font-weight:500;font-size:10.5px}
.tile .money{display:flex;align-items:baseline;gap:6px;margin:2px 0 1px}
.tile .money .r{font-size:19px;font-weight:680}
.tile .money .m{font-size:10.5px;color:var(--muted)}
.tile.live .money .r{color:var(--live)}
.tile.over{border-color:var(--alarm)}
.tile.over .money .r{color:var(--alarm)}

/* --- tier 4 --- */
.scar{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.scarcell{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--raised)}
.scarcell.dry{border-color:var(--live)}
.scarcell .p{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em}
.scarcell .counts{display:flex;gap:7px;margin-top:3px;align-items:baseline}
.scarcell .e{font-size:17px;font-weight:690;color:var(--safe)}
.scarcell.dry .e{color:var(--live)}
.scarcell .rest{font-size:10.5px;color:var(--faint)}

.rows{display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:baseline;
     padding:3px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.row:last-child{border-bottom:none}
.row .r-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r-price{font-weight:660}
.row .r-delta{font-size:10.5px;min-width:38px;text-align:right}
.over-ref{color:var(--alarm)} .under-ref{color:var(--safe)}

.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12.5px;
    border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)}
.kv .v{font-weight:640}

#warnings{display:flex;flex-direction:column;gap:5px}
.warn{background:var(--live-bg);border:1px solid var(--live-line);color:var(--live);
      border-radius:7px;padding:6px 9px;font-size:12px}

footer{
  position:fixed;bottom:0;left:0;right:0;background:var(--bg);
  border-top:1px solid var(--line);padding:5px 16px;font-size:10.5px;color:var(--faint);
  display:flex;justify-content:space-between;gap:12px;z-index:20;
}
.dot{display:inline-block;width:6px;height:6px;border-radius:9px;background:var(--safe);margin-right:5px}
.dot.stale{background:var(--live)} .dot.dead{background:var(--alarm)}

/* Degrades in reverse priority order: your money and the player on the block
   survive any viewport, per the brief's hierarchy. */
@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr)}
  .big .v{font-size:26px} .big.hero .v{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="mine"></div>
<main>
  <section id="focus" class="span2"><h2>On the block</h2><div id="focus-body"></div></section>
  <section id="rivals" class="span2"><h2>Rivals <span class="aside" id="rivals-sort"></span></h2><div id="rivals-body"></div></section>
  <section id="scarcity"><h2>What is left</h2><div id="scarcity-body"></div></section>
  <section id="market"><h2>Market</h2><div id="market-body"></div></section>
  <section id="plan"><h2>Plan</h2><div id="plan-body"></div></section>
  <section id="turns"><h2>Nomination order</h2><div id="turns-body"></div></section>
  <section id="sales" class="span2"><h2>Recent sales</h2><div id="sales-body"></div></section>
  <section id="warnbox" class="span2" hidden><h2>Notes</h2><div id="warnings"></div></section>
</main>
<footer>
  <span id="conn"><span class="dot"></span>connecting…</span>
  <span id="stamp"></span>
</footer>

<script>
"use strict";

// Money is never rendered as a bare number when it is a floor. An unknown price
// is charged at the $1 minimum, so the figure understates what a rival has
// actually spent and overstates what they can still bid — deliberately, since
// that is the safe direction for advice, but only if you can see that is what
// you are looking at.
const money = (n, floor) => (n === null || n === undefined) ? "—" : `$${n}${floor ? "+" : ""}`;
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c;
  if (txt !== undefined) n.textContent = txt; return n; };
const clear = n => { while (n.firstChild) n.removeChild(n.firstChild); };

let lastStamp = null, failures = 0;

function chips(gaps) {
  const wrap = el("div", "chips");
  const entries = Object.entries(gaps || {}).filter(([, v]) => v > 0);
  if (!entries.length) { wrap.appendChild(el("span", "chip", "starters full")); return wrap; }
  for (const [slot, n] of entries) {
    wrap.appendChild(el("span", "chip need", n > 1 ? `${slot}×${n}` : slot));
  }
  return wrap;
}

function box(cls, label, value, sub) {
  const b = el("div", cls);
  b.appendChild(el("span", "k", label));
  b.appendChild(el("span", "v num", value));
  if (sub) b.appendChild(el("span", "sub", sub));
  return b;
}

function renderMine(v) {
  const host = document.getElementById("mine");
  clear(host);
  const me = v.me;
  if (!me) { host.appendChild(box("big", "waiting", "—", "no team")); return; }

  const g = v.nomination && v.nomination.guidance;
  // The hero is whatever you act on right now: the advisable bid when someone
  // is up, your legal ceiling otherwise.
  if (g) {
    host.appendChild(box("big hero", "bid up to", `$${g.max_advisable_bid}`,
      `range $${g.suggested_low}–$${g.suggested_high}`));
  } else {
    host.appendChild(box("big hero", "max legal bid", `$${me.max_legal_bid}`,
      "every other slot still costs $1"));
  }

  host.appendChild(box(
    "big" + (me.is_overspent ? " alarmstate" : ""),
    "remaining", money(me.remaining, me.remaining_is_floor),
    me.unknown_price_count ? `${me.unknown_price_count} price(s) unknown` : "all prices known"));

  host.appendChild(box("big", "legal max", `$${me.max_legal_bid}`,
    g && g.ceiling_is_optimistic ? `~$${g.safe_legal_bid} at sheet value` : "hard ceiling"));

  host.appendChild(box("big", "roster",
    `${me.roster_count}/${v.league ? v.league.draftable_slots : "?"}`,
    `${me.open_slots} to fill`));

  const need = el("div", "big");
  need.appendChild(el("span", "k", "still need"));
  need.appendChild(chips(me.starter_gaps));
  host.appendChild(need);
}

function threatRow(t, plan) {
  const cls = "threat " + (t.is_live ? "live" : "inert");
  const row = el("div", cls);
  row.appendChild(el("div", "who", t.label));
  row.appendChild(el("div", "cap num", `$${t.max_legal_bid}`));
  row.appendChild(el("div", "meta",
    `${money(t.remaining, t.remaining_is_floor)} · ${t.open_at_position} slot(s)`));
  return row;
}

function renderFocus(v) {
  const host = document.getElementById("focus-body");
  const sect = document.getElementById("focus");
  clear(host);
  const nom = v.nomination;
  sect.classList.toggle("up", !!nom);

  if (!nom) {
    host.appendChild(el("div", "empty", "Nothing up for bid."));
    return;
  }

  const head = el("div", "player");
  head.appendChild(el("div", "name", nom.name));
  if (nom.position) head.appendChild(el("span", "pos", nom.position));
  host.appendChild(head);

  const g = nom.guidance;
  if (!g) {
    host.appendChild(el("div", "empty", "No reference data loaded — no bid guidance."));
    return;
  }

  const row = el("div", "bidrow");
  const inflated = (g.inflated_value && g.inflated_value !== nom.reference_value)
    ? `sheet $${nom.reference_value} → $${g.inflated_value}` : `sheet $${nom.reference_value ?? "—"}`;
  row.appendChild(box("bidbox advice", "bid up to", `$${g.max_advisable_bid}`, inflated));
  row.appendChild(box("bidbox ceiling", "you cannot exceed",
    g.ceiling_is_optimistic ? `$${g.max_legal_bid}+` : `$${g.max_legal_bid}`,
    g.ceiling_is_optimistic ? `~$${g.safe_legal_bid} once priced` : "hard ceiling"));
  row.appendChild(box("bidbox", "top rival can go", `$${g.contested_ceiling}`,
    g.fills_starter_gap ? "fills a starting slot for you" : "bench only for you"));
  if (g.plan_cap) {
    row.appendChild(box("bidbox", "your plan cap", `$${g.plan_cap}`,
      g.exceeds_plan_cap ? "exceeded — your call" : "within plan"));
  }
  host.appendChild(row);

  const live = g.threats.filter(t => t.is_live);
  const sub = document.createElement("div");
  sub.style.cssText = "font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:2px 0 6px";
  sub.textContent = live.length
    ? `${live.length} rival(s) can afford him and start him`
    : "nobody who needs the position can afford him";
  host.appendChild(sub);

  const list = el("div", "threats");
  const SHOWN = 6;
  for (const t of g.threats.slice(0, SHOWN)) list.appendChild(threatRow(t));
  if (g.threats.length > SHOWN) {
    const rest = g.threats.length - SHOWN;
    const restLive = g.threats.slice(SHOWN).filter(t => t.is_live).length;
    list.appendChild(el("div", "empty",
      `… and ${rest} more${restLive ? `, ${restLive} of them live` : ", none live"}`));
  }
  host.appendChild(list);

  if (g.reasons && g.reasons.length) {
    const ul = el("ul", "reasons");
    for (const r of g.reasons) ul.appendChild(el("li", null, r));
    host.appendChild(ul);
  }
}

function renderRivals(v) {
  const host = document.getElementById("rivals-body");
  const note = document.getElementById("rivals-sort");
  clear(host);

  const g = v.nomination && v.nomination.guidance;
  const liveBy = new Map();
  if (g) for (const t of g.threats) liveBy.set(t.team_id, t);
  note.textContent = g
    ? `sorted by who can take ${v.nomination.name}`
    : "sorted by money left";

  // Never index by team id: this league runs 1-5 and 7-13, and there is no
  // team 6. Sort a copy of the array instead.
  const rivals = v.teams.filter(t => !t.is_me).slice();
  rivals.sort((a, b) => {
    if (g) {
      const A = liveBy.get(a.team_id), B = liveBy.get(b.team_id);
      const al = A && A.is_live ? 1 : 0, bl = B && B.is_live ? 1 : 0;
      if (al !== bl) return bl - al;
      if (A && B && A.max_legal_bid !== B.max_legal_bid) return B.max_legal_bid - A.max_legal_bid;
    }
    return b.remaining - a.remaining;
  });

  const grid = el("div", "grid");
  const me = v.teams.find(t => t.is_me);
  if (me) grid.appendChild(tile(me, null, true));
  for (const t of rivals) grid.appendChild(tile(t, liveBy.get(t.team_id), false));
  host.appendChild(grid);
}

function tile(t, threat, isMe) {
  let cls = "tile";
  if (isMe) cls += " me";
  else if (threat) cls += threat.is_live ? " live" : " inert";
  if (t.is_overspent) cls += " over";

  const n = el("div", cls);
  const who = el("div", "who");
  who.appendChild(el("span", null, t.label));
  who.appendChild(el("span", "slots", `${t.roster_count}/${t.roster_count + t.open_slots}`));
  n.appendChild(who);

  const m = el("div", "money");
  m.appendChild(el("span", "r num", money(t.remaining, t.remaining_is_floor)));
  m.appendChild(el("span", "m num", `max $${t.max_legal_bid}`));
  n.appendChild(m);

  n.appendChild(chips(t.starter_gaps));
  return n;
}

function renderScarcity(v) {
  const host = document.getElementById("scarcity-body");
  clear(host);
  const s = v.scarcity || {};
  const keys = Object.keys(s);
  if (!keys.length) { host.appendChild(el("div", "empty", "No reference file loaded.")); return; }

  const grid = el("div", "scar");
  for (const pos of keys) {
    const d = s[pos];
    const cell = el("div", "scarcell" + (d.is_drying_up ? " dry" : ""));
    cell.appendChild(el("div", "p", pos));
    const counts = el("div", "counts");
    counts.appendChild(el("span", "e num", String(d.elite)));
    counts.appendChild(el("span", "rest num", `${d.startable} startable`));
    cell.appendChild(counts);
    cell.appendChild(el("div", "rest", `${d.total_remaining} left`));
    grid.appendChild(cell);
  }
  host.appendChild(grid);
}

function renderMarket(v) {
  const host = document.getElementById("market-body");
  clear(host);
  const m = v.market || {};
  const kv = (k, val) => { const r = el("div", "kv");
    r.appendChild(el("span", "k", k)); r.appendChild(el("span", "v num", val)); return r; };

  // Null until five priced sales have landed, deliberately — early noise would
  // swing every threshold that reads it. Say so rather than show a gauge
  // pinned at a meaningless value.
  host.appendChild(kv("inflation",
    m.inflation_ratio === null || m.inflation_ratio === undefined
      ? "not enough sales yet"
      : `${m.inflation_ratio.toFixed(2)}× ${m.read}`));
  host.appendChild(kv("spent league-wide", `$${m.dollars_spent ?? 0}`));
  host.appendChild(kv("still in the room", `$${m.dollars_remaining ?? 0}`));
  host.appendChild(kv("sales", String(m.sales ?? 0)));
  if (m.unknown_prices) {
    host.appendChild(kv("prices still unknown", String(m.unknown_prices)));
  }
}

function renderPlan(v) {
  const host = document.getElementById("plan-body");
  clear(host);
  const p = v.strategy;
  if (!p) { host.appendChild(el("div", "empty", "No plan declared.")); return; }

  const kv = (k, val, cls) => { const r = el("div", "kv");
    r.appendChild(el("span", "k", k));
    r.appendChild(el("span", "v num " + (cls || ""), val)); return r; };

  if (p.shortfall > 0) {
    host.appendChild(kv("SHORT", `$${p.shortfall}`, "over-ref"));
  } else {
    host.appendChild(kv("spare", `$${p.slack}`, "under-ref"));
  }
  host.appendChild(kv("spent", `$${p.spent_total} of $${p.budget}`));
  host.appendChild(kv("plan still wants", `$${p.still_calls_for}`));
  if (p.max_on_one_player) {
    host.appendChild(kv("one-player cap", `$${p.max_on_one_player}`,
      p.breached_cap ? "over-ref" : ""));
  }
  for (const row of (p.positions || []).filter(r => r.is_material)) {
    host.appendChild(kv(`${row.position} vs plan`,
      `${row.variance > 0 ? "+" : ""}${row.variance}`,
      row.variance > 0 ? "over-ref" : "under-ref"));
  }
}

function renderTurns(v) {
  const host = document.getElementById("turns-body");
  clear(host);
  const p = v.nomination_plan;
  if (!p || !p.order_known) {
    host.appendChild(el("div", "empty", "No draft order on file."));
    return;
  }
  const kv = (k, val, cls) => { const r = el("div", "kv");
    r.appendChild(el("span", "k", k));
    r.appendChild(el("span", "v " + (cls || ""), val)); return r; };

  host.appendChild(kv("nomination", `${Math.min(p.turns_taken + 1, p.total_nominations)} of ${p.total_nominations}`));
  if (p.on_the_clock) {
    host.appendChild(kv("up next", p.on_the_clock.is_me ? "YOU" : p.on_the_clock.label,
      p.on_the_clock.is_me ? "under-ref" : ""));
  }
  if (p.nominations_until_mine !== null && p.nominations_until_mine !== undefined) {
    host.appendChild(kv("your turn",
      p.nominations_until_mine === 0 ? "next" : `in ${p.nominations_until_mine}`));
  }
  host.appendChild(kv("your turns left", String(p.my_turns_left)));
  if (p.disagreement) {
    const w = el("div", "warn", p.disagreement);
    w.style.marginTop = "8px";
    host.appendChild(w);
  }
}

function renderSales(v) {
  const host = document.getElementById("sales-body");
  clear(host);
  const sales = v.recent_sales || [];
  if (!sales.length) { host.appendChild(el("div", "empty", "No sales yet.")); return; }

  // Never index by team id — this league runs 1-5 and 7-13, with no team 6.
  const labels = new Map((v.teams || []).map(t => [t.team_id, t.label]));

  const rows = el("div", "rows");
  for (const s of sales.slice().reverse()) {
    const r = el("div", "row");
    const who = labels.get(s.team_id) || `team${s.team_id}`;
    r.appendChild(el("div", "r-name", `${s.name} → ${who}`));

    const price = el("div", "r-price num", s.price_known ? `$${s.price}` : "$?");
    // The payload says where every price came from. Flattening that would undo
    // the ground-truth-vs-observation split the whole engine is built on, so an
    // estimated or hand-typed number is marked rather than dressed up.
    if (!s.price_known) price.classList.add("over-ref");
    price.title = `price: ${s.price_provenance || "UNKNOWN"}`;
    r.appendChild(price);

    const d = s.price_known ? s.delta : null;
    r.appendChild(el("div",
      "r-delta num " + (d === null || d === undefined ? "" : d > 0 ? "over-ref" : "under-ref"),
      (d === null || d === undefined) ? "" : `${d > 0 ? "+" : ""}${d}`));
    rows.appendChild(r);
  }
  host.appendChild(rows);
}

function renderWarnings(v) {
  const box = document.getElementById("warnbox");
  const host = document.getElementById("warnings");
  clear(host);
  const w = v.warnings || [];
  box.hidden = !w.length;
  for (const line of w) host.appendChild(el("div", "warn", line));
}

function render(v) {
  if (!v.initialized) {
    document.getElementById("mine").innerHTML =
      '<div class="big"><span class="k">waiting</span><span class="v">—</span>' +
      '<span class="sub">no draft started</span></div>';
    return;
  }
  renderMine(v); renderFocus(v); renderRivals(v);
  renderScarcity(v); renderMarket(v); renderPlan(v); renderTurns(v);
  renderSales(v); renderWarnings(v);
  document.getElementById("stamp").textContent =
    `${v.draft_id || ""} · ${v.generated_at || ""}`;
}

function setConn(state, text) {
  const c = document.getElementById("conn");
  clear(c);
  c.appendChild(el("span", "dot " + state));
  c.appendChild(document.createTextNode(text));
}

async function poll() {
  try {
    const res = await fetch("state.json", { cache: "no-store" });
    const v = await res.json();
    failures = 0;
    // The dashboard never announces — no toast, no flash, no modal steal. It
    // re-renders silently and lets you notice in your own time.
    render(v);
    setConn("", "live");
    lastStamp = v.generated_at;
  } catch (err) {
    failures += 1;
    // Degrades rather than blanking: the last good board stays on screen,
    // because a stale number you can see beats an empty panel mid-draft.
    setConn(failures > 3 ? "dead" : "stale",
      failures > 3 ? "disconnected — is `ffa dashboard` still running?" : "reconnecting…");
  }
}

(async () => {
  let interval = 2000;
  try {
    const meta = await (await fetch("meta.json", { cache: "no-store" })).json();
    if (meta.poll_interval) interval = meta.poll_interval * 1000;
  } catch (err) { /* defaults are fine */ }
  await poll();
  setInterval(poll, interval);
})();
</script>
